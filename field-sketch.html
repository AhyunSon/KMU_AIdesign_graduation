<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>현장 스케치 - AIxD 제1회 졸업전시 'NULL'</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'Offbit';
            src: url('OffBitTrial-Regular.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            background-color: black;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
            line-height: 1.6;
        }

        /* 로딩 스피너 */
        .page-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s, visibility 0.5s;
        }

        .page-loader.hidden {
            opacity: 0;
            visibility: hidden;
        }

        /* 로딩 중 모든 콘텐츠 숨기기 */
        body:not(.loaded) .main-content,
        body:not(.loaded) nav {
            visibility: hidden;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(200, 255, 61, 0.3);
            border-top-color: #c8ff3d;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }`n`n        /* 로딩 중 모든 콘텐츠 숨기기 */`n        body:not(.loaded) .main-content,`n        body:not(.loaded) nav {`n            visibility: hidden;`n        }

        /* 네비게이션 바 */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            text-decoration: none;
            transition: opacity 0.3s;
            display: flex;
            align-items: center;
        }

        .nav-logo:hover {
            opacity: 0.7;
        }

        .nav-menu {
            display: flex;
            gap: 2rem;
            list-style: none;
            position: relative;
        }

        .nav-menu > li {
            position: relative;
        }

        .nav-menu a {
            color: white;
            text-decoration: none;
            font-size: 1rem;
            transition: opacity 0.3s;
            position: relative;
            display: block;
            padding: 0.5rem 0;
        }

        .nav-menu a:hover {
            opacity: 0.7;
        }

        .nav-menu a.active::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: white;
        }

        /* Dropdown Menu */
        .dropdown {
            position: relative;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: rgba(0, 0, 0, 0.95);
            min-width: 180px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1001;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-top: 0;
            padding-top: 0.5rem;
        }

        .dropdown-content a {
            color: white;
            padding: 0.8rem 1.2rem;
            text-decoration: none;
            display: block;
            font-size: 0.9rem;
            transition: background-color 0.3s;
        }

        .dropdown-content a:hover {
            background-color: rgba(255, 255, 255, 0.1);
            opacity: 1;
        }

        .dropdown:hover .dropdown-content,
        .dropdown-content:hover {
            display: block;
        }

        /* 메인 컨텐�?*/
        .main-content {
            margin-top: 80px;
            padding: 3rem 2rem;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }

        .section {
            margin-bottom: 4rem;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .section:nth-child(1) { animation-delay: 0.1s; }
        .section:nth-child(2) { 
            animation-delay: 0.3s;
            margin-top: 10rem;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-title {
            font-family: 'Offbit', monospace;
            font-size: 2rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            color: #c8ff3d;
            border: none;
            text-align: center;
        }

        /* 사진 갤러리 */
        .gallery-container {
            margin: 0 120px;
        }

        .preview-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: 0 auto 2rem auto;
            aspect-ratio: 16/9;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .preview-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.75rem;
            color: white;
            cursor: pointer;
            background-color: rgba(255, 255, 255, 0.1);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s;
            user-select: none;
            z-index: 10;
            line-height: 0;
            padding: 0;
            border: none;
            font-family: Arial, sans-serif;
        }

        .preview-nav:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .preview-prev {
            left: 1rem;
        }

        .preview-next {
            right: 1rem;
        }

        .preview-fullscreen {
            position: absolute;
            bottom: 1rem;
            right: 1rem;
            width: 50px;
            height: 50px;
            padding: 0;
            background-color: rgba(200, 255, 61, 0.1);
            color: #c8ff3d;
            border: 1px solid #c8ff3d;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s;
            z-index: 10;
        }

        .preview-fullscreen:hover {
            background-color: rgba(200, 255, 61, 0.2);
        }

        .photo-gallery {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 1rem;
            margin-top: 2rem;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        .photo-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            aspect-ratio: 1/1;
            transition: transform 0.3s, border-color 0.3s;
            cursor: pointer;
        }

        .photo-item:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.1);
        }

        .photo-item.active {
            border-color: #c8ff3d;
            box-shadow: 0 0 20px rgba(200, 255, 61, 0.5);
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .photo-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: rgba(255, 255, 255, 0.5);
            font-style: italic;
            text-align: center;
            padding: 2rem;
            background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.06) 100%);
            border: 1px dashed rgba(255, 255, 255, 0.2);
        }

        /* 비디오 섹션 */
        .video-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto 2rem;
            border-radius: 8px;
            overflow: hidden;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .video-container video {
            width: 100%;
            height: auto;
            display: block;
        }

        .video-label {
            background-color: rgba(0, 0, 0, 0.8);
            padding: 0.8rem 1.2rem;
            font-size: 1rem;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .placeholder-text {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-style: italic;
            padding: 4rem 2rem;
            background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.06) 100%);
            border-radius: 8px;
            border: 1px dashed rgba(255, 255, 255, 0.2);
        }

        /* 라이트박스 모달 */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            padding: 2rem;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-image-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 0;
        }

        .lightbox img#lightboxImg {
            max-width: 90%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }

        .lightbox-close {
            position: absolute;
            top: 2rem;
            right: 2rem;
            font-size: 2rem;
            color: white;
            cursor: pointer;
            background-color: rgba(255, 255, 255, 0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s;
            z-index: 2001;
        }

        .lightbox-close:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.75rem;
            color: white;
            cursor: pointer;
            background-color: rgba(255, 255, 255, 0.1);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s;
            user-select: none;
            z-index: 2001;
        }

        .lightbox-nav:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .lightbox-prev {
            left: 2rem;
        }

        .lightbox-next {
            right: 2rem;
        }

        /* 라이트박스 썸네일 스트립 */
        .lightbox-thumbnails {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 0.5rem;
            max-width: 600px;
            width: 90%;
            margin-top: 1.5rem;
            flex-shrink: 0;
        }

        .lightbox-thumb {
            aspect-ratio: 1/1;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.3s, opacity 0.3s;
            opacity: 0.6;
        }

        .lightbox-thumb:hover {
            opacity: 0.9;
        }

        .lightbox-thumb.active {
            border-color: #c8ff3d;
            opacity: 1;
        }

        .lightbox-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 모바일 반응형 */
        @media screen and (max-width: 768px) {
            .nav-container {
                padding: 1rem;
                flex-direction: column;
                gap: 1rem;
            }

            .nav-menu {
                gap: 1rem;
                font-size: 0.9rem;
            }

            .main-content {
                margin-top: 120px;
                padding: 2rem 1rem;
            }

            .section-title {
                font-size: 1.5rem;
            }

            .gallery-container {
                margin: 0 1rem;
            }

            .preview-container {
                aspect-ratio: 4/3;
            }

            .photo-gallery {
                grid-template-columns: repeat(6, 1fr);
                gap: 0.5rem;
            }

            .photo-item {
                border-radius: 4px;
            }

            .lightbox {
                padding: 1rem;
            }

            .lightbox-image-container {
                flex: 1;
                min-height: 0;
            }

            .lightbox img#lightboxImg {
                max-width: 100%;
                max-height: 100%;
            }

            .lightbox-thumbnails {
                grid-template-columns: repeat(6, 1fr);
                gap: 0.3rem;
                margin-top: 1rem;
            }

            .lightbox-thumb {
                border-radius: 2px;
            }

            .lightbox-close {
                top: 0.5rem;
                right: 0.5rem;
                width: 36px;
                height: 36px;
                font-size: 1.2rem;
            }

            .lightbox-nav {
                width: 36px;
                height: 36px;
            }

            .lightbox-prev {
                left: 0.5rem;
            }

            .lightbox-next {
                right: 0.5rem;
            }

            .preview-nav {
                width: 36px;
                height: 36px;
            }

            .preview-fullscreen {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }
        }

        @media screen and (max-width: 480px) {
            .photo-gallery {
                grid-template-columns: repeat(3, 1fr);
            }

            .lightbox-thumbnails {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>

    <!-- 메인 컨텐츠 -->
    <div class="main-content">
        <!-- Making Film -->
        <section class="section" id="making-film">
            <h2 class="section-title">Making Film</h2>
            <div class="video-container">
                <iframe
                    width="100%"
                    height="506"
                    src="https://www.youtube.com/embed/g1dCwd-fHQU"
                    title="Making Film"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen
                    loading="lazy">
                </iframe>
            </div>
        </section>

        <!-- 현장 사진 -->
        <section class="section" id="gallery">
            <h2 class="section-title">Gallery</h2>
            <div class="gallery-container">
                <!-- 미리보기 -->
                <div class="preview-container">
                    <img id="previewImage" class="preview-image" src="" alt="Preview">
                    <div class="preview-nav preview-prev" onclick="previousImage(event)">◀</div>
                    <div class="preview-nav preview-next" onclick="nextImage(event)">▶</div>
                    <button class="preview-fullscreen" onclick="openFullscreen()" title="크게보기">⛶</button>
                </div>

                <!-- 썸네일 그리드 -->
                <div class="photo-gallery" id="photoGallery">
                    <!-- 사진 썸네일이 여기에 동적으로 표시됩니다 -->

    <!-- 라이트박스 모달 -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <div class="lightbox-close">×</div>
        <div class="lightbox-nav lightbox-prev" onclick="navigateLightbox(event, -1)">◀</div>
        <div class="lightbox-nav lightbox-next" onclick="navigateLightbox(event, 1)">▶</div>
        <div class="lightbox-image-container" onclick="event.stopPropagation()">
            <img id="lightboxImg" src="" alt="확대 이미지" onclick="closeLightbox()">
        </div>
        <div class="lightbox-thumbnails" id="lightboxThumbnails" onclick="event.stopPropagation()">
            <!-- 썸네일이 동적으로 추가됩니다 -->
        </div>
    </div>

    <script>
        // 페이지 DOM 로드 완료시 스피너 제거 (더 빠른 표시)
        document.addEventListener('DOMContentLoaded', function() {
            const loader = document.getElementById('pageLoader');
            document.body.classList.add('loaded');
            setTimeout(() => {
                document.body.classList.add('loaded');
            setTimeout(() => {
                loader.classList.add('hidden');
            }, 100);
            }, 100);
        });

        let currentImageIndex = 0;
        let imageList = [];

        // 화면 크기에 따른 페이지당 이미지 수
        function getImagesPerPage() {
            return window.innerWidth <= 480 ? 3 : 6;
        }

        // 현재 페이지 계산
        function getCurrentPage() {
            return Math.floor(currentImageIndex / getImagesPerPage());
        }

        // 현재 페이지의 썸네일 업데이트
        function updateThumbnails() {
            const gallery = document.getElementById('photoGallery');
            const imagesPerPage = getImagesPerPage();
            const currentPage = getCurrentPage();
            const startIndex = currentPage * imagesPerPage;
            const endIndex = Math.min(startIndex + imagesPerPage, imageList.length);

            gallery.innerHTML = '';

            for (let i = startIndex; i < endIndex; i++) {
                const photoItem = document.createElement('div');
                photoItem.className = 'photo-item';
                if (i === currentImageIndex) photoItem.classList.add('active');
                photoItem.onclick = () => selectImage(i);

                const img = document.createElement('img');
                img.src = imageList[i];
                img.alt = `현장 사진 ${i + 1}`;
                img.loading = 'lazy';

                photoItem.appendChild(img);
                gallery.appendChild(photoItem);
            }
        }

        // 라이트박스 썸네일 업데이트
        function updateLightboxThumbnails() {
            const container = document.getElementById('lightboxThumbnails');
            const imagesPerPage = getImagesPerPage();
            const currentPage = getCurrentPage();
            const startIndex = currentPage * imagesPerPage;
            const endIndex = Math.min(startIndex + imagesPerPage, imageList.length);

            container.innerHTML = '';

            for (let i = startIndex; i < endIndex; i++) {
                const thumb = document.createElement('div');
                thumb.className = 'lightbox-thumb';
                if (i === currentImageIndex) thumb.classList.add('active');
                thumb.onclick = (e) => {
                    e.stopPropagation();
                    selectImageInLightbox(i);
                };

                const img = document.createElement('img');
                img.src = imageList[i];
                img.alt = `현장 사진 ${i + 1}`;

                thumb.appendChild(img);
                container.appendChild(thumb);
            }
        }

        // 라이트박스에서 이미지 선택
        function selectImageInLightbox(index) {
            currentImageIndex = index;
            const lightboxImg = document.getElementById('lightboxImg');
            lightboxImg.src = imageList[currentImageIndex];

            // 미리보기도 업데이트
            const previewImage = document.getElementById('previewImage');
            previewImage.src = imageList[currentImageIndex];

            updateThumbnails();
            updateLightboxThumbnails();
        }

        // 현장 사진 폴더에서 이미지 로드
        async function loadGalleryImages() {
            const gallery = document.getElementById('photoGallery');
            const previewImage = document.getElementById('previewImage');

            // 현장 사진 폴더의 모든 사진 (optimized WebP)
            const images = [
                '현장 사진_optimized/0. 포스터 1.webp',
                '현장 사진_optimized/0. 포스터 2.webp',
                '현장 사진_optimized/1. 인포데스크.JPG의 사본.webp',
                '현장 사진_optimized/1. 전시장 입구1.webp',
                '현장 사진_optimized/1. 전시장 입구2.webp',
                '현장 사진_optimized/1. 전시장 입구3.webp',
                '현장 사진_optimized/김동규 _ Face to Dot_1.webp',
                '현장 사진_optimized/김동규 _ Face to Dot_2.webp',
                '현장 사진_optimized/김동규 _ Face to Dot_3.webp',
                '현장 사진_optimized/김동규 _ Face to Dot_5.webp',
                '현장 사진_optimized/김동규, 손아현, 윤서연 _ 소릿_1.webp',
                '현장 사진_optimized/김동규, 손아현, 윤서연 _ 소릿_2.webp',
                '현장 사진_optimized/김동규, 손아현, 윤서연 _ 소릿_3.webp',
                '현장 사진_optimized/김민승 _ Snover_1.webp',

                return;

            previewImage.src = images[0];
            previewImage.onerror = function() {
                this.src = '';
            };

            // 첫 페이지 썸네일 생성
            updateThumbnails();

        // 이미지 선택
        function selectImage(index) {
            if (imageList.length === 0) return;

            const prevPage = getCurrentPage();
            currentImageIndex = index;
            const newPage = getCurrentPage();

            const previewImage = document.getElementById('previewImage');
            previewImage.src = imageList[currentImageIndex];

            // 페이지가 바뀌면 썸네일 전체 갱신, 아니면 active만 업데이트
            if (prevPage !== newPage) {
                updateThumbnails();
            } else {
                // 활성 썸네일 업데이트
                const startIndex = newPage * getImagesPerPage();
                document.querySelectorAll('.photo-item').forEach((item, i) => {
                    item.classList.toggle('active', (startIndex + i) === currentImageIndex);
                });
            }
        }

        // 이전 이미지
        function previousImage(event) {
            event.stopPropagation();
            if (imageList.length === 0) return;

            let newIndex = currentImageIndex - 1;
            if (newIndex < 0) newIndex = imageList.length - 1;
            selectImage(newIndex);
        }

        // 다음 이미지
        function nextImage(event) {
            event.stopPropagation();
            if (imageList.length === 0) return;

            let newIndex = currentImageIndex + 1;
            if (newIndex >= imageList.length) newIndex = 0;
            selectImage(newIndex);
        }

        // 전체보기 (라이트박스)
        function openFullscreen() {
            if (imageList.length === 0) return;

            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightboxImg');
            lightboxImg.src = imageList[currentImageIndex];
            lightbox.classList.add('active');

            // 라이트박스 썸네일 업데이트
            updateLightboxThumbnails();
        }

        // 라이트박스 닫기
        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('active');
        }

        // 라이트박스 이미지 네비게이션
        function navigateLightbox(event, direction) {
            event.stopPropagation();
            if (imageList.length === 0) return;

            const prevPage = getCurrentPage();
            currentImageIndex += direction;
            if (currentImageIndex < 0) currentImageIndex = imageList.length - 1;
            if (currentImageIndex >= imageList.length) currentImageIndex = 0;
            const newPage = getCurrentPage();

            const lightboxImg = document.getElementById('lightboxImg');
            lightboxImg.src = imageList[currentImageIndex];

            // 미리보기 업데이트
            const previewImage = document.getElementById('previewImage');
            previewImage.src = imageList[currentImageIndex];

            // 페이지가 바뀌면 썸네일 전체 갱신
            if (prevPage !== newPage) {
                updateThumbnails();
                updateLightboxThumbnails();
            } else {
                // 활성 썸네일만 업데이트
                const startIndex = newPage * getImagesPerPage();
                document.querySelectorAll('.photo-item').forEach((item, i) => {
                    item.classList.toggle('active', (startIndex + i) === currentImageIndex);
                });
                document.querySelectorAll('.lightbox-thumb').forEach((item, i) => {
                    item.classList.toggle('active', (startIndex + i) === currentImageIndex);
                });
            }
        }

        // ESC 키로 라이트박스 닫기
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeLightbox();
            } else if (e.key === 'ArrowLeft') {
                previousImage(e);
            } else if (e.key === 'ArrowRight') {
                nextImage(e);
            }
        });

        // 페이지 로드 시 갤러리 이미지 로드
        window.addEventListener('load', loadGalleryImages);

        // 화면 크기 변경 시 썸네일 다시 렌더링
        let resizeTimeout;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (imageList.length > 0) {
                    updateThumbnails();
                    if (document.getElementById('lightbox').classList.contains('active')) {
                        updateLightboxThumbnails();
                    }
                }
            }, 250);
        });
